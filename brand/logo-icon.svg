<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OC CAB icon">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffc95e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#41e0e6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0a0e16"/>
  <!-- cab silhouette: single continuous teardrop roofline like the Cybercab -->
  <path d="M38 158 C58 122 96 100 138 100 C176 100 206 118 218 144 L222 158 Z"
        fill="none" stroke="url(#teal)" stroke-width="7" stroke-linejoin="round"/>
  <!-- wheels as inductive-pad glow dots -->
  <circle cx="80" cy="168" r="11" fill="#2ee6a8"/>
  <circle cx="182" cy="168" r="11" fill="#2ee6a8"/>
  <!-- charging pad line beneath -->
  <line x1="52" y1="196" x2="204" y2="196" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- OC monogram -->
  <text x="128" y="82" text-anchor="middle" font-family="Poppins, Montserrat, Arial, sans-serif"
        font-weight="800" font-size="52" letter-spacing="2" fill="url(#gold)">OC</text>
</svg>
