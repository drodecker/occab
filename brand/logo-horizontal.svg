<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="OC CAB logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffc95e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#41e0e6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background (remove this rect for transparent version) -->
  <rect width="640" height="160" fill="#0a0e16"/>

  <g font-family="Poppins, Montserrat, Arial, sans-serif" font-weight="800">
    <text x="60" y="103" font-size="76" letter-spacing="2" fill="url(#gold)">OC</text>
    <text x="205" y="103" font-size="76" letter-spacing="6" fill="#ffffff">CAB</text>
  </g>

  <!-- glowing teal underline with circuit node -->
  <g filter="url(#glow)">
    <line x1="62" y1="122" x2="436" y2="122" stroke="url(#teal)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="436" cy="122" r="6" fill="#2ee6a8"/>
    <line x1="442" y1="122" x2="470" y2="122" stroke="#2ee6a8" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/>
  </g>

  <text x="62" y="148" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="8" fill="#93a0b8">REIMAGINE YOUR RIDE</text>
</svg>
